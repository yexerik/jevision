name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies and Chromium
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade 'pip>=26.2,<27'
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium
          pnpm install --frozen-lockfile
      - name: Test source and build
        run: |
          pnpm test
          pnpm build
          JEV_UI_TEST_ROOT=dist .venv/bin/python -m unittest tests.test_tool_modules -v
      - name: Check publication files
        run: pnpm check:public --files-only
